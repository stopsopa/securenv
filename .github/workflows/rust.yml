name: Rust CI & Release

on:
  push:
    branches: [ "**" ]
    tags: [ "**" ]
  pull_request:

permissions:
  contents: write

jobs:
  test:
    name: Test on macOS arm64
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Compile binary
        run: /bin/bash compile.sh

      - name: Run E2E tests
        run: /bin/bash test.sh

  build-matrix:
    name: Build ${{ matrix.target }}
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact_name: securenv-darwin-arm64
            use_cross: false
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact_name: securenv-linux-x64
            use_cross: false
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            artifact_name: securenv-linux-arm64
            use_cross: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross (if required)
        if: matrix.use_cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build binary
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi
          mkdir -p dist
          cp target/${{ matrix.target }}/release/securenv dist/${{ matrix.artifact_name }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.artifact_name }}

  release:
    name: Publish Release
    needs: build-matrix
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Prepare release files and checksums
        run: |
          mkdir -p release-dist
          find release-artifacts -type f -exec cp {} release-dist/ \;
          cd release-dist
          shasum -a 256 securenv-* > SHA256SUMS.txt
          
          cat << 'EOF' > ../release_notes.md
          ### SHA-256 Checksums
          
          | Binary | SHA-256 Checksum |
          | --- | --- |
          EOF
          while read -r hash file; do
            echo "| \`$file\` | \`$hash\` |" >> ../release_notes.md
          done < SHA256SUMS.txt
          
          cat << 'EOF' >> ../release_notes.md
          
          #### Verify Checksum
          - **macOS / Linux (`shasum`)**:
            ```bash
            shasum -a 256 <binary-name>
            ```
          - **Linux (`sha256sum`)**:
            ```bash
            sha256sum <binary-name>
            ```
          - **Verify using SHA256SUMS.txt**:
            ```bash
            shasum -a 256 -c SHA256SUMS.txt
            # or on Linux:
            sha256sum -c SHA256SUMS.txt
            ```
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: true
          body_path: release_notes.md
          files: |
            release-dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
