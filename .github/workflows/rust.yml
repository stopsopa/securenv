name: Rust CI & Release

on:
  push:
    branches: [ "**" ]
    tags: [ "**" ]
  pull_request:

permissions:
  contents: write

jobs:
  test:
    name: Test on macOS arm64
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Compile binary
        run: /bin/bash compile.sh

      - name: Run E2E tests
        run: /bin/bash test.sh

  build-matrix:
    name: Build ${{ matrix.target }}
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact_name: securenv-darwin-arm64
            use_cross: false
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact_name: securenv-linux-x64
            use_cross: false
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            artifact_name: securenv-linux-arm64
            use_cross: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross (if required)
        if: matrix.use_cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build binary
        run: |
          if [ -n "${{ github.ref_name }}" ]; then
            export SECURENV_VERSION="${{ github.ref_name }}"
          fi
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi
          mkdir -p dist
          cp target/${{ matrix.target }}/release/securenv dist/${{ matrix.artifact_name }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.artifact_name }}

  release:
    name: Publish Release
    needs: build-matrix
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Prepare release files and checksums
        run: |
          mkdir -p release-dist
          find release-artifacts -type f -exec cp {} release-dist/ \;
          cd release-dist
          shasum -a 256 securenv-* > SHA256SUMS.txt
          
          REPO="${{ github.repository }}"
          TAG="${{ github.ref_name }}"
          BASE_URL="https://github.com/${REPO}/releases/download/${TAG}"
          
          cat << EOF > ../release_notes.md
          ### Installation & Checksum Verification
          
          EOF
          
          while read -r hash file; do
            cat << EOF >> ../release_notes.md
          #### \`${file}\`
          
          \`\`\`bash
          # Download via curl:
          curl -fL -o securenv \\
            ${BASE_URL}/${file}
          
          # Or download via wget:
          wget -O securenv \\
            ${BASE_URL}/${file}
          
          # Verify checksum:
          echo '${hash}  securenv' \\
            | shasum -a 256 -c -
          # (on Linux without shasum: echo '${hash}  securenv' | sha256sum -c -)
          \`\`\`
          
          EOF
          done < SHA256SUMS.txt
          
          cat << EOF >> ../release_notes.md
          ### SHA-256 Checksums
          
          | Binary | SHA-256 Checksum |
          | --- | --- |
          EOF
          
          while read -r hash file; do
            echo "| \`$file\` | \`$hash\` |" >> ../release_notes.md
          done < SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          body_path: release_notes.md
          files: |
            release-dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
